<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<meta http-equiv="refresh" content="0; url=shell.html">
<link rel="canonical" href="shell.html">
<script>
  // 쿼리(?...)와 해시(#...)를 유지한 채 shell.html로 이동
  location.replace("shell.html" + location.search + location.hash);
</script>
</head>
<body>
<p>자동으로 이동하지 않으면 <a href="shell.html">여기를 눌러 주세요</a>.</p>
</body>
</html>
